name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    name: Validate with ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [terraform, tofu]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        if: matrix.engine == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.engine == 'tofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Check formatting
        run: ${{ matrix.engine }} fmt -check -recursive .

      - name: Initialize and validate every root
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r versions_file; do
            directory=${versions_file%/versions.tf}
            echo "Validating ${directory}"
            ${{ matrix.engine }} -chdir="${directory}" init -backend=false -input=false
            ${{ matrix.engine }} -chdir="${directory}" validate
            rm -rf "${directory}/.terraform" "${directory}/.terraform.lock.hcl"
          done < <(find modules examples -name versions.tf -print | sort)
